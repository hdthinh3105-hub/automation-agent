name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy API & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy API
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy Worker
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
